services:
  - type: web
    name: forest-fire-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TEMP_THRESHOLD
        value: "50"
      - key: HUMIDITY_THRESHOLD
        value: "20"
      - key: ALERT_CONSEC_REQUIRED
        value: "3"
      - key: SMOKE_BASELINE_RATIO
        value: "2.5"
      - key: SMOKE_BASELINE_MIN_SAMPLES
        value: "30"
      - key: SMOKE_BASELINE_ALPHA
        value: "0.02"
      - key: SMOKE_THRESHOLD_FALLBACK
        value: "2000"
      - key: SMOKE_SAFETY_CEILING
        value: "3500"
      - key: NODE_VERSION
        value: "20"
